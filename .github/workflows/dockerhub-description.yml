name: Docker Hub descriptions

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub/**
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish cerberus-selfhost description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: romanvaxman/cerberus-selfhost
          short-description: Self-hosted website scanner with Lighthouse, Nuclei, OWASP ZAP, and sqlmap.
          readme-filepath: ./docs/dockerhub/cerberus-selfhost.md
      - name: Publish cerberus-aio description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: romanvaxman/cerberus-aio
          short-description: One-container launcher for the Cerberus scanner stack; Docker socket required.
          readme-filepath: ./docs/dockerhub/cerberus-aio.md
